<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="UniConnected employment opportunity icon">
  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="300" fill="#2aa8e0"/>

  <!-- Briefcase -->
  <g fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- Case body -->
    <rect x="220" y="330" width="584" height="400" rx="70" fill="#ffffff" stroke="none"/>
    <!-- Flap curve (cut line) -->
    <path d="M260 510 C360 610, 664 610, 764 510" stroke="#2aa8e0" />
    <!-- Handle -->
    <path d="M420 330 V270 Q420 240 450 240 H574 Q604 240 604 270 V330" stroke="#ffffff"/>
    <!-- Latch -->
    <rect x="484" y="502" width="56" height="78" rx="10" fill="#2aa8e0" stroke="none"/>
  </g>

  <!-- Magnifying glass + check -->
  <g fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lens -->
    <circle cx="720" cy="700" r="118" fill="#2aa8e0"/>
    <!-- Lens rim -->
    <circle cx="720" cy="700" r="118"/>
    <!-- Handle -->
    <path d="M802 782 L892 872" />
    <!-- Check -->
    <path d="M680 700 L708 728 L764 668" />
  </g>
</svg>